[project]
name = "braindump"
version = "0.2.0"
description = "Portable Claude-integrated personal knowledge management with CLI and local web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matous Mojzis" }]
dependencies = [
    "markdown>=3.10.3",
    "nh3>=0.3.7",
    "pydantic>=2.13.4",
    "typer>=0.27.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "watchfiles>=1.2.0",
    "markupsafe>=3.0.3",
]
app = [
    "braindump[web]",
    "pywebview[qt]>=6.2.1",
    # Comes with pywebview[qt] anyway, but desktop.py imports it directly to
    # wire the window's copy menu, so it's a dependency of ours too.
    "qtpy>=2.4.3",
    # Same story on macOS: pywebview pulls pyobjc in there regardless, but
    # desktop.py imports Foundation itself to rename the app bundle.
    "pyobjc-framework-Cocoa>=9.0; sys_platform=='darwin'",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-llmstxt>=0.5.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "vulture",
    "biston>=0.6.0",
    "deptry",
    "poethepoet>=0.48.0",
]

[project.scripts]
bd = "braindump.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["braindump"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF", "S", "PERF", "FURB"]
# TRY003: custom exception classes for every raise is heavier than it's worth here.
ignore = ["TRY003"]

[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "S", "DTZ", "PLC0415"]
# Typer's API requires typer.Option()/Argument() calls as defaults (B008) and
# gives commands many parameters (PLR0913/PLR0917) — Typer binds them from flags,
# so nobody ever passes them positionally. Idiomatic, not smells.
"braindump/cli/main.py" = ["B008", "PLR0913", "PLR0917"]
# Deliberate `rg` shell-out for full-text search: fixed args, no user-controlled shell.
"braindump/core/query.py" = ["S603", "S607"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=braindump --cov-report=term-missing"

[tool.coverage.run]
source = ["braindump"]

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["braindump"]
min_confidence = 80

[tool.biston.scan]
exclude = ["scripts/**", "tests/**", "**/conftest.py"]

[tool.deptry]
# Neither of these is importable under its package name, and both are
# optional-extra deps loaded lazily inside desktop.py — teach deptry the
# mapping so they aren't flagged. (pyobjc-framework-Cocoa ships more modules
# than Foundation; only the one braindump imports is worth listing.)
package_module_name_map = {"pywebview" = ["webview"], "pyobjc-framework-Cocoa" = ["Foundation"]}

[tool.deptry.per_rule_ignores]
# braindump self-references its own `web` extra from the `app` extra.
DEP002 = ["jinja2", "python-multipart", "braindump"]
# jinja2 (via fastapi.templating) and python-multipart (form parsing) are used
# by FastAPI at runtime without a direct import; braindump is the self-ref.

[tool.poe]
verbosity = -1
include = "poe_tasks.toml"
