[project]
name = "braindump"
version = "0.2.0"
description = "Portable Claude-integrated personal knowledge management with CLI and local web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matous Mojzis" }]
dependencies = [
    "markdown>=3.10.2",
    "nh3>=0.3.6",
    "pydantic>=2.13.4",
    "typer>=0.26.8",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.50.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "watchfiles>=1.2.0",
    "markupsafe>=3.0.3",
]
app = [
    "braindump[web]",
    "pywebview>=6.2.1",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocs-llmstxt>=0.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "ruff",
    "ty",
    "vulture",
    "deptry",
    "poethepoet>=0.48.0",
]

[project.scripts]
bd = "braindump.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["braindump"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF", "S", "PERF", "FURB"]
# TRY003: custom exception classes for every raise is heavier than it's worth here.
ignore = ["TRY003"]

[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "S", "DTZ", "PLC0415"]
# Typer's API requires typer.Option()/Argument() calls as defaults (B008) and
# gives commands many parameters (PLR0913) — both are idiomatic, not smells.
"braindump/cli/main.py" = ["B008", "PLR0913"]
# Deliberate `rg` shell-out for full-text search: fixed args, no user-controlled shell.
"braindump/core/query.py" = ["S603", "S607"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=braindump --cov-report=term-missing"

[tool.coverage.run]
source = ["braindump"]

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["braindump"]
min_confidence = 80

[tool.deptry]
# pywebview's import name is `webview`, and it's an optional-extra dep loaded
# lazily inside desktop.py — teach deptry the mapping so it isn't flagged.
package_module_name_map = {"pywebview" = ["webview"]}

[tool.deptry.per_rule_ignores]
# braindump self-references its own `web` extra from the `app` extra.
DEP002 = ["jinja2", "python-multipart", "braindump"]
# jinja2 (via fastapi.templating) and python-multipart (form parsing) are used
# by FastAPI at runtime without a direct import; braindump is the self-ref.

[tool.poe]
verbosity = -1
include = "poe_tasks.toml"
